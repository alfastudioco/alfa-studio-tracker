//  -- RecoveryPanel (one-time triage for records orphaned by the missing-projId bug) --
const ORPHAN_KEYS = ["undefined","null"]; // items saved with a missing (undefined) or explicitly-null projId
function RecoveryPanel({projPayments,setProjPayments,projNotes,setProjNotes,projs,fmtCost,onClose}) {
  const orphanPmts  = ORPHAN_KEYS.flatMap(k=>projPayments[k]||[]);
  const orphanNotes = ORPHAN_KEYS.flatMap(k=>projNotes[k]||[]);
  const projOptions = [...projs].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const selStyle = {flex:1,minWidth:0,fontSize:12,padding:"5px 8px",borderRadius:6,border:"1px solid #E5E2DC",background:"#FFF"};
  const discardStyle = {fontSize:20,lineHeight:1,color:"#A8A29E",background:"none",border:"none",cursor:"pointer",flexShrink:0,padding:"0 4px"};

  function clearOrphanKeys(obj, id) {
    const upd = {...obj};
    ORPHAN_KEYS.forEach(k=>{ if(upd[k]) upd[k]=upd[k].filter(x=>x.id!==id); });
    return upd;
  }
  function assignPayment(pmt, projId) {
    if(!projId) return;
    setProjPayments(p=>({...clearOrphanKeys(p,pmt.id),
      [projId]: [...(p[projId]||[]), {...pmt, projId:+projId}]
    }));
  }
  function discardPayment(id) {
    setProjPayments(p=>clearOrphanKeys(p,id));
  }
  function assignNote(note, projId) {
    if(!projId) return;
    setProjNotes(p=>({...clearOrphanKeys(p,note.id),
      [projId]: [...(p[projId]||[]), {...note, projId:+projId}]
    }));
  }
  function discardNote(id) {
    setProjNotes(p=>clearOrphanKeys(p,id));
  }

  return h("div",{className:"sheet-bg",onClick:onClose},
    h("div",{className:"sheet",onClick:e=>e.stopPropagation(),style:{maxWidth:640,padding:"0 16px 16px"}},
      h("div",{className:"sheet-handle"}),
      h("div",{style:{fontSize:16,fontWeight:700,margin:"14px 0 4px"}},"Recover Unassigned Records"),
      h("div",{style:{fontSize:12,color:"#78716C",marginBottom:14}},
        "A bug briefly saved these without a project link. Pick the correct project for each, or discard if it was a duplicate/test entry."),

      orphanPmts.length===0&&orphanNotes.length===0&&h("div",{style:{fontSize:13,color:"#78716C",padding:"24px 0",textAlign:"center"}},"Nothing left to recover."),

      orphanPmts.length>0&&h("div",null,
        h("div",{style:{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#A8A29E",margin:"10px 0 6px"}},"Payments ("+orphanPmts.length+")"),
        orphanPmts.map(pmt=>
          h("div",{key:"p"+pmt.id,style:{display:"flex",gap:8,alignItems:"center",padding:"8px 0",borderBottom:"1px solid #F0EDE8"}},
            h("div",{style:{flex:"0 0 90px",fontSize:13,fontWeight:700,color:"#16A34A"}},fmtCost(+pmt.amount)),
            h("div",{style:{flex:"0 0 130px",fontSize:11,color:"#78716C"}},pmt.type+" · "+pmt.date),
            h("select",{style:selStyle,value:"",onChange:e=>assignPayment(pmt,e.target.value)},
              h("option",{value:""},"Assign to project…"),
              projOptions.map(pr=>h("option",{key:pr.id,value:pr.id},pr.name+(pr.client?" — "+pr.client:"")))
            ),
            h("button",{onClick:()=>discardPayment(pmt.id),title:"Discard - not a real payment",style:discardStyle},"×")
          )
        )
      ),

      orphanNotes.length>0&&h("div",null,
        h("div",{style:{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#A8A29E",margin:"16px 0 6px"}},"Notes ("+orphanNotes.length+")"),
        orphanNotes.map(note=>
          h("div",{key:"n"+note.id,style:{padding:"8px 0",borderBottom:"1px solid #F0EDE8"}},
            h("div",{style:{fontSize:12,color:"#1C1917",whiteSpace:"pre-wrap",marginBottom:6}},note.text),
            h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
              h("select",{style:selStyle,value:"",onChange:e=>assignNote(note,e.target.value)},
                h("option",{value:""},"Assign to project…"),
                projOptions.map(pr=>h("option",{key:pr.id,value:pr.id},pr.name+(pr.client?" — "+pr.client:"")))
              ),
              h("button",{onClick:()=>discardNote(note.id),title:"Discard - not a real note",style:discardStyle},"×")
            )
          )
        )
      ),

      h("div",{style:{marginTop:16,textAlign:"right"}},
        h("button",{onClick:onClose,style:{borderRadius:8,padding:"8px 16px",fontSize:13,fontWeight:600,background:"#1C1917",color:"#FFF",border:"none",cursor:"pointer"}},"Done")
      )
    )
  );
}

function ProjectsTab({projs,setProjs,emps,entries,cogs,setCogs,projDetails,setProjDetails,
  projNotes,setProjNotes,projPayments,setProjPayments,clients,vendors,
  fmtHrs,fmtCost,entryCost,projCogsTotals,dbReady,T}) {

  const [filter,setFilter]   = useState("All");
  const [search,setSearch]   = useState("");
  const [expandId,setExpandId] = useState(null);
  const [editProj,setEditProj] = useState(null); // null | "new" | proj
  const [pf,setPf]           = useState({name:"",client:"",status:"Not Started",deadline:"",assignedTo:[],salePrice:"",notes:"",jobName:""});
  const [addPhotoId,setAddPhotoId] = useState(null);
  const [quickSheet,setQuickSheet] = useState(null); // {projId, section}
  const [addNoteId,setAddNoteId]   = useState(null);
  const [quickNote,setQuickNote]   = useState("");
  const [cogsSheet,setCogsSheet]   = useState(null);
  const [confirmDel,setConfirmDel] = useState(null);
  const [uploading,setUploading]   = useState(false);
  const [showRecovery,setShowRecovery] = useState(false);

  const orphanCount = ORPHAN_KEYS.reduce((s,k)=>s+(projPayments[k]||[]).length+(projNotes[k]||[]).length,0);

  const clientNames = [...new Set(projs.map(p=>p.client).filter(Boolean))].sort();
  const jobNames    = [...new Set(projs.map(p=>p.jobName).filter(Boolean))].sort();

  const filtered = projs.filter(p=>{
    if(filter!=="All"&&p.status!==filter) return false;
    if(search){
      const s=search.toLowerCase();
      return (p.name||"").toLowerCase().includes(s)||(p.client||"").toLowerCase().includes(s)||(p.jobName||"").toLowerCase().includes(s);
    }
    return true;
  });

  // Stat cards
  const allProjs = projs;
  const totalSale   = allProjs.reduce((s,p)=>s+(+p.salePrice||0),0);
  const totalPaid   = allProjs.reduce((s,p)=>{const pmts=(projPayments[p.id]||[]);return s+pmts.reduce((a,x)=>a+(+x.amount||0),0);},0);
  const totalOwing  = totalSale - totalPaid;
  const inProg      = allProjs.filter(p=>p.status==="In Progress").length;
  function profitOf(p) { return (+p.salePrice||0) - entryCost(p.id) - projCogsTotals(p.id).total; }
  const totalProfit = allProjs.reduce((s,p)=>s+profitOf(p),0);

  function openEdit(proj) {
    if(proj==="new") { setPf({name:"",client:"",status:"Not Started",deadline:"",assignedTo:emps.filter(e=>e.active!==false).map(e=>e.id),salePrice:"",notes:"",jobName:""}); setEditProj("new"); }
    else { setPf({name:proj.name,client:proj.client,status:proj.status,deadline:proj.deadline||"",assignedTo:[...(proj.assignedTo||[])],salePrice:proj.salePrice||"",notes:proj.notes||"",jobName:proj.jobName||""}); setEditProj(proj); }
  }

  function saveProj() {
    if(!pf.name.trim()) return;
    if(editProj==="new") {
      const np={id:Date.now(),...pf};
      setProjs(p=>[...p,np]);
    } else {
      setProjs(p=>p.map(x=>x.id===editProj.id?{...x,...pf,updatedAt:Date.now()}:x));
    }
    setEditProj(null);
  }

  function delProj(id) {
    setProjs(p=>p.filter(x=>x.id!==id));
    fetch(SB_URL+"/rest/v1/projects?id=eq."+String(id),{method:"DELETE",mode:"cors",headers:SB_HEADERS}).catch(()=>{});
    setConfirmDel(null);
    if(expandId===id) setExpandId(null);
  }

  async function uploadFiles(projId, files) {
    setUploading(true);
    for(const file of files) {
      const ext = file.name.split(".").pop();
      const fileId = Date.now()+Math.random();
      const path = "proj-"+projId+"/"+fileId+"."+ext;
      try {
        const url = await uploadFile("project-files",path,file,file.type);
        const nf = {id:fileId,name:file.name,type:file.type,url,path,date:new Date().toISOString().slice(0,10)};
        setProjDetails(p=>{
          const key=String(projId);
          const upd={...p,[key]:{...(p[key]||{}),files:[...((p[key]||{}).files||[]),nf]}};
          const pd=upd[key];
          dbSaveKeyed("projdetails",[{id:key,data:{...pd,projId:+projId,files:pd.files.map(f=>f.url?{...f,data:undefined}:f)}}]);
          return upd;
        });
      } catch(err) { alert("Upload failed: "+err.message); }
    }
    setUploading(false);
    setAddPhotoId(null);
  }

  const STATUSES_ALL = ["All",...STATUSES];
  const statusCounts = STATUSES.reduce((a,s)=>{a[s]=projs.filter(p=>p.status===s).length;return a;},{});

  return h("div",{style:{flex:1,overflowY:"auto",padding:"16px 20px",background:BG}},

    // Stat cards
    h("div",{className:"stat-grid"},
      h("div",{className:"stat-card"},h("div",{className:"lbl"},"In Progress"),h("div",{className:"val"},inProg)),
      h("div",{className:"stat-card"},h("div",{className:"lbl"},"Total Sale"),h("div",{className:"val gold"},"$"+totalSale.toLocaleString())),
      h("div",{className:"stat-card"},h("div",{className:"lbl"},"Collected"),h("div",{className:"val green"},"$"+totalPaid.toLocaleString())),
      h("div",{className:"stat-card"},h("div",{className:"lbl"},"Outstanding"),h("div",{className:"val red"},"$"+totalOwing.toLocaleString())),
      h("div",{className:"stat-card"},h("div",{className:"lbl"},"Total Profit"),h("div",{className:"val",style:{color:totalProfit>=0?"#2d7a4f":"#c0392b"}},(totalProfit<0?"-":"")+fmtCost(Math.abs(totalProfit)))),
      h("div",{className:"stat-card"},h("div",{className:"lbl"},"Total Projects"),h("div",{className:"val"},projs.length))
    ),

    // Per-status sale-value, outstanding-balance, and profit totals
    h("div",{className:"stat-grid",style:{marginTop:-6}},
      STATUSES.map(s=>{
        const list=allProjs.filter(p=>p.status===s);
        const sale=list.reduce((sum,p)=>sum+(+p.salePrice||0),0);
        const owing=list.reduce((sum,p)=>{
          const paid=(projPayments[p.id]||[]).reduce((a,x)=>a+(+x.amount||0),0);
          return sum+Math.max(0,(+p.salePrice||0)-paid);
        },0);
        const profit=list.reduce((sum,p)=>sum+profitOf(p),0);
        return h("div",{key:s,className:"stat-card"},
          h("div",{className:"lbl"},s),
          h("div",{className:"val"},"$"+sale.toLocaleString()),
          h("div",{style:{fontSize:12,fontWeight:600,color:owing>0?"#c0392b":"#2d7a4f",marginTop:3}},"$"+owing.toLocaleString()+" owing"),
          h("div",{style:{fontSize:12,fontWeight:600,color:profit>=0?"#2563EB":"#c0392b",marginTop:2}},(profit<0?"-":"")+fmtCost(Math.abs(profit))+" profit"),
          h("div",{style:{fontSize:10,color:"#999",marginTop:2}},list.length+" project"+(list.length!==1?"s":""))
        );
      })
    ),

    // Toolbar
    h("div",{style:{display:"flex",gap:10,alignItems:"center",marginBottom:12,flexWrap:"wrap"}},
      h("div",{className:"search-wrap",style:{flex:1,minWidth:180}},
        h("i",{className:"ti ti-search",style:{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#aaa",fontSize:14}}),
        h("input",{className:"search-bar",placeholder:"Search projects, clients, jobs…",value:search,onChange:e=>setSearch(e.target.value)})
      ),
      h("div",{className:"filter-tabs"},
        STATUSES_ALL.map(s=>h("button",{key:s,className:"ftab"+(filter===s?" active":""),onClick:()=>setFilter(s)},
          s==="All"?"All ("+projs.length+")":s+(statusCounts[s]?" ("+statusCounts[s]+")":"")
        ))
      ),
      h("button",{className:"btn-primary",onClick:()=>openEdit("new")},"+ Project"),
      orphanCount>0&&h("button",{onClick:()=>setShowRecovery(true),style:{borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:600,padding:"7px 14px",background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",whiteSpace:"nowrap"}},
        "⚠ "+orphanCount+" Unassigned — Recover")
    ),

    // Table
    h("div",{style:{background:SURF,borderRadius:12,border:"0.5px solid "+LINE,overflow:"hidden"}},
      h("table",{className:"tbl"},
        h("thead",null,
          h("tr",null,
            h("th",null,"Project / Client"),
            h("th",null,"Job Group"),
            h("th",null,"Status"),
            h("th",null,"Assigned"),
            h("th",{className:"r"},"Hours"),
            h("th",{className:"r"},"Labor"),
            h("th",{className:"r"},"Sale"),
            h("th",{className:"r"},"Deposit"),
            h("th",{className:"r"},"Owing"),
            h("th",{className:"r"},"Profit"),
            h("th",{className:"r"},"Margin"),
            h("th",null,"")
          )
        ),
        h("tbody",null,
          filtered.length===0 && h("tr",null,h("td",{colSpan:12,style:{textAlign:"center",padding:"40px",color:DIM}},
            search?"No projects match your search.":"No projects.")),
          filtered.map(proj=>{
            const isExp = expandId===proj.id;
            const hrs = entries.filter(e=>e.end&&e.projId===proj.id).reduce((s,e)=>s+(e.end-e.start),0);
            const labor = entryCost(proj.id);
            const ct = projCogsTotals(proj.id);
            const pmts = (projPayments[proj.id]||[]).reduce((s,x)=>s+(+x.amount||0),0);
            const sale = +proj.salePrice||0;
            const owing = sale - pmts;
            const profit = sale - labor - ct.total;
            const marginPct = sale>0 ? profit/sale*100 : null;
            const files = (projDetails[String(proj.id)]||{}).files||[];
            const crew = emps.filter(e=>(proj.assignedTo||[]).includes(e.id));

            return [
              // Main row
              h("tr",{key:proj.id,style:{cursor:"pointer"},onClick:()=>setExpandId(isExp?null:proj.id)},
                h("td",null,
                  h("div",{style:{fontWeight:500,fontSize:12,color:NAVY}},proj.name),
                  proj.client&&h("div",{style:{fontSize:10,color:SUB,marginTop:1}},proj.client)
                ),
                h("td",{style:{fontSize:11,color:SUB}},proj.jobName||"—"),
                h("td",null,h(StatusPill,{status:proj.status})),
                h("td",{style:{fontSize:11,color:SUB}},crew.map(e=>e.name).join(", ")||"—"),
                h("td",{className:"r",style:{fontSize:11,color:hrs>0?"#1a1a1a":DIM}},hrs>0?fmtHrs(hrs):"—"),
                h("td",{className:"r",style:{fontSize:11,color:labor>0?"#1a1a1a":DIM}},labor>0?fmtCost(labor):"—"),
                h("td",{className:"r",style:{fontSize:12,fontWeight:sale>0?500:400,color:sale>0?NAVY:DIM}},sale>0?"$"+sale.toLocaleString():"—"),
                h("td",{className:"r",style:{fontSize:11,color:pmts>0?"#2d7a4f":DIM}},pmts>0?fmtCost(pmts):"—"),
                h("td",{className:"r",style:{fontSize:11,fontWeight:owing>0?500:400,color:owing>0?GOLD:DIM}},owing>0?fmtCost(owing):"—"),
                h("td",{className:"r",style:{fontSize:11,fontWeight:500,color:profit>=0?"#2d7a4f":"#c0392b"}},(profit<0?"-":"")+fmtCost(Math.abs(profit))),
                h("td",{className:"r",style:{fontSize:11,color:marginPct===null?DIM:(marginPct>=0?"#2d7a4f":"#c0392b")}},marginPct===null?"—":marginPct.toFixed(0)+"%"),
                h("td",{onClick:e=>e.stopPropagation()},
                  h("div",{className:"act-btns"},
                    h("button",{className:"btn-ghost",style:{padding:"3px 8px"},onClick:()=>openEdit(proj)},"Edit"),
                    h("button",{className:"btn-danger",style:{padding:"3px 8px"},onClick:()=>setConfirmDel(proj)},"Del")
                  )
                )
              ),
              // Expanded detail row
              isExp && h("tr",{key:proj.id+"-exp",className:"exp-row"},
                h("td",{colSpan:12,className:"exp-panel"},
                  h("div",{style:{padding:"16px 20px"}},
                    // 8-action grid
                    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:6,marginBottom:16}},
                      [
                        {icon:"ti-photo",label:"Photo",    fn:()=>setAddPhotoId(proj.id)},
                        {icon:"ti-note",label:"Note",     fn:()=>{setQuickNote("");setAddNoteId(proj.id);}},
                        {icon:"ti-palette",label:"Selects",fn:()=>setQuickSheet({projId:proj.id,section:"selections"})},
                        {icon:"ti-folder",label:"Files",   fn:()=>setQuickSheet({projId:proj.id,section:"files"})},
                        {icon:"ti-clock",label:"Time",    fn:()=>setQuickSheet({projId:proj.id,section:"timelog"})},
                        {icon:"ti-coins",label:"Costs",   fn:()=>setCogsSheet(proj.id)},
                        {icon:"ti-credit-card",label:"Pay",fn:()=>setQuickSheet({projId:proj.id,section:"payments"})},
                        {icon:"ti-list",label:"Log",      fn:()=>setQuickSheet({projId:proj.id,section:"timelog"})},
                      ].map(({icon,label,fn})=>
                        h("button",{key:label,onClick:fn,style:{
                          display:"flex",flexDirection:"column",alignItems:"center",gap:4,
                          padding:"8px 4px",border:"0.5px solid "+LINE,borderRadius:8,
                          background:SURF,cursor:"pointer",fontSize:9,color:SUB,fontWeight:500}},
                          h("i",{className:"ti "+icon,style:{fontSize:16,color:NAVY}}),
                          label
                        )
                      )
                    ),
                    // File thumbnails
                    files.length>0&&h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}},
                      files.map(f=>h("div",{key:f.id,onClick:()=>f.url&&window.open(f.url,"_blank"),
                        style:{width:56,height:48,borderRadius:6,border:"0.5px solid "+LINE,background:"#f8f6f2",
                          display:"flex",alignItems:"center",justifyContent:"center",cursor:f.url?"pointer":"default",overflow:"hidden"}},
                        f.url&&(f.type||"").startsWith("image")
                          ? h("img",{src:f.url,style:{width:"100%",height:"100%",objectFit:"cover"}})
                          : h("i",{className:(f.type||"").includes("pdf")?"ti ti-file-type-pdf":"ti ti-file",style:{fontSize:20,color:NAVY}})
                      ))
                    ),
                    // Notes preview
                    (projNotes[proj.id]||[]).length>0&&h("div",{style:{fontSize:11,color:SUB,fontStyle:"italic",marginBottom:8}},
                      '"'+(projNotes[proj.id]||[]).slice(-1)[0].text+'"'
                    )
                  )
                )
              )
            ];
          })
        )
      )
    ),

    // ── Edit / Add sheet ──
    editProj&&h("div",{className:"sheet-bg",onClick:()=>setEditProj(null)},
      h("div",{className:"sheet",onClick:e=>e.stopPropagation()},
        h("div",{className:"sheet-handle"}),
        h("div",{style:{padding:"16px 20px 24px"}},
          h("div",{style:{fontSize:14,fontWeight:600,color:NAVY,marginBottom:16}},editProj==="new"?"New Project":"Edit Project"),
          h(F,{label:"Project Name",value:pf.name,onChange:v=>setPf({...pf,name:v})}),
          h(F,{label:"Client",value:pf.client,onChange:v=>setPf({...pf,client:v}),child:
            h("select",{value:pf.client,onChange:e=>setPf({...pf,client:e.target.value})},
              h("option",{value:""},"— Select client —"),
              clientNames.map(c=>h("option",{key:c,value:c},c))
            )
          }),
          h(F,{label:"Job / Group",child:
            h("div",null,
              h("select",{value:pf.jobName==="__new__"?"__new__":pf.jobName||"",
                onChange:e=>setPf({...pf,jobName:e.target.value==="__new__"?"__new__":e.target.value})},
                h("option",{value:""},"— No group —"),
                jobNames.map(j=>h("option",{key:j,value:j},j)),
                h("option",{value:"__new__"},"+ New group…")
              ),
              pf.jobName==="__new__"&&h("input",{autoFocus:true,placeholder:"Group name (e.g. Keystone Residence)",
                style:{marginTop:6,width:"100%",background:"#f8f6f2",border:"1.5px solid "+GOLD,borderRadius:7,color:"#1a1a1a",padding:"9px 12px",fontSize:13,outline:"none"},
                onBlur:e=>{ if(e.target.value.trim()) setPf({...pf,jobName:e.target.value.trim()}); else setPf({...pf,jobName:""}); },
                onKeyDown:e=>{ if(e.key==="Enter"&&e.target.value.trim()) setPf({...pf,jobName:e.target.value.trim()}); }
              })
            )
          }),
          h(F,{label:"Status",value:pf.status,onChange:v=>setPf({...pf,status:v}),options:STATUSES}),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
            h(F,{label:"Sale Price ($)",value:pf.salePrice,onChange:v=>setPf({...pf,salePrice:v}),type:"number"}),
            h(F,{label:"Deadline",value:pf.deadline,onChange:v=>setPf({...pf,deadline:v}),type:"date"})
          ),
          h(F,{label:"Assign Crew",child:
            h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
              emps.map(e=>{ const sel=(pf.assignedTo||[]).includes(e.id);
                return h("div",{key:e.id,onClick:()=>setPf({...pf,assignedTo:sel?(pf.assignedTo||[]).filter(x=>x!==e.id):[...(pf.assignedTo||[]),e.id]}),
                  style:{padding:"5px 12px",borderRadius:20,fontSize:11,fontWeight:500,cursor:"pointer",
                    background:sel?e.color+"20":"#f0ede8",color:sel?e.color:"#666",
                    border:"1px solid "+(sel?e.color:LINE)}},e.name);
              })
            )
          }),
          h(F,{label:"Notes",value:pf.notes,onChange:v=>setPf({...pf,notes:v}),type:"textarea"}),
          h("div",{style:{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}},
            h("button",{className:"btn-ghost",onClick:()=>setEditProj(null)},"Cancel"),
            h("button",{className:"btn-primary",onClick:saveProj},editProj==="new"?"Create Project":"Save Changes")
          )
        )
      )
    ),

    // ── Add Photo sheet ──
    addPhotoId&&h("div",{className:"sheet-bg",onClick:()=>setAddPhotoId(null)},
      h("div",{className:"sheet",onClick:e=>e.stopPropagation()},
        h("div",{className:"sheet-handle"}),
        h("div",{style:{padding:"16px 20px 28px"}},
          h("div",{style:{fontSize:14,fontWeight:600,color:NAVY,marginBottom:4}},(projs.find(p=>p.id===addPhotoId)||{}).name),
          h("div",{style:{fontSize:12,color:SUB,marginBottom:16}},"Add photos or files"),
          h("div",{
            onDragOver:e=>{e.preventDefault();e.currentTarget.style.borderColor=GOLD;},
            onDragLeave:e=>{e.currentTarget.style.borderColor=LINE;},
            onDrop:async e=>{ e.preventDefault(); e.currentTarget.style.borderColor=LINE; await uploadFiles(addPhotoId,Array.from(e.dataTransfer.files)); },
            style:{border:"2px dashed "+LINE,borderRadius:12,padding:"32px 20px",textAlign:"center",transition:"border-color 0.15s"}},
            h("label",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:10,cursor:"pointer"}},
              h("input",{type:"file",accept:"image/*,application/pdf",multiple:true,style:{display:"none"},
                onChange:async e=>{ await uploadFiles(addPhotoId,Array.from(e.target.files)); e.target.value=""; }}),
              h("i",{className:"ti ti-cloud-upload",style:{fontSize:36,color:NAVY}}),
              h("span",{style:{fontSize:13,fontWeight:500,color:SUB}},uploading?"Uploading…":"Drag & drop or tap to choose"),
              h("span",{style:{fontSize:11,color:DIM}},"Photos, PDFs · Multiple files supported")
            )
          )
        )
      )
    ),

    // ── Add Note sheet ──
    addNoteId&&h("div",{className:"sheet-bg",onClick:()=>setAddNoteId(null)},
      h("div",{className:"sheet",onClick:e=>e.stopPropagation()},
        h("div",{className:"sheet-handle"}),
        h("div",{style:{padding:"16px 20px 28px"}},
          h("div",{style:{fontSize:14,fontWeight:600,color:NAVY,marginBottom:12}},(projs.find(p=>p.id===addNoteId)||{}).name+" — Note"),
          h("textarea",{autoFocus:true,value:quickNote,onChange:e=>setQuickNote(e.target.value),
            placeholder:"Type your note…",rows:4,
            style:{width:"100%",border:"0.5px solid "+LINE,borderRadius:8,padding:"10px 12px",fontSize:13,outline:"none",resize:"none",background:"#f8f6f2",boxSizing:"border-box",marginBottom:12}}),
          h("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
            h("button",{className:"btn-ghost",onClick:()=>{setAddNoteId(null);setQuickNote("");}}, "Cancel"),
            h("button",{className:"btn-primary",onClick:async()=>{
              if(!quickNote.trim()) return;
              const note={id:Date.now(),projId:addNoteId,text:quickNote.trim(),author:"Admin",ts:Date.now()};
              setProjNotes(p=>({...p,[addNoteId]:[...(p[addNoteId]||[]),note]}));
              setAddNoteId(null); setQuickNote("");
              const ok=await dbSave("projnotes",[note]);
              if(!ok) alert("⚠ This note was saved on your screen but failed to sync to the server — check your internet connection. If it's still showing after a refresh, it saved; if not, re-enter it.");
            }},"Save Note")
          )
        )
      )
    ),

    // ── Quick sheet (Selects / Files / Time / Pay) ──
    quickSheet&&h("div",{className:"sheet-bg",onClick:()=>setQuickSheet(null)},
      h("div",{className:"sheet",style:{maxHeight:"90vh"},onClick:e=>e.stopPropagation()},

        return "<img src='"+src+"' style='width:100%;display:block;border-radius:8px;margin-bottom:8px'>";
      }).join("");
      const selLabels={material:"Material",finish:"Paint / Stain",hardware:"Hardware",doorProfile:"Door Profile"};
      const sels=["material","finish","hardware","doorProfile"].filter(k=>(r.selections||{})[k]).map(k=>
        "<div style='padding:8px 12px;background:#f5f3ef;border-radius:7px;margin:4px 0'><div style='font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#999;margin-bottom:2px'>"+selLabels[k]+"</div><div style='font-size:13px;font-weight:500;color:#1a1a1a'>"+(r.selections||{})[k]+"</div></div>"
      ).join("");

    }).join("");

      "<div style='text-align:right;font-size:12px;line-height:2.2'><div><span style='font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#555'>Client&nbsp;&nbsp;</span><span style='color:#ccc'>"+(prop.client||"—")+"</span></div>"+
      "<div><span style='font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#555'>Date&nbsp;&nbsp;</span><span style='color:#ccc'>"+dateStr+"</span></div>"+
      "<div><span style='font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#555'>Ref&nbsp;&nbsp;</span><span style='color:#ccc'>"+refStr+"</span></div></div></div>"+
      "<div style='padding-top:24px;border-top:1px solid #2a2a2a'><div style='font-size:10px;text-transform:uppercase;letter-spacing:0.16em;color:#555;margin-bottom:8px'>Project proposal</div>"+
      "<div style='font-size:26px;font-weight:500;color:#fff'>"+prop.name+"</div></div></div>"+
      "<div style='background:#fff;padding:40px 48px;border-bottom:1px solid #e8e5e0'><div style='font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:#999;margin-bottom:18px'>Scope &amp; investment</div>"+
      "<table style='width:100%;border-collapse:collapse'><thead><tr style='border-bottom:2px solid #1a1e2e'>"+

  async function generate(prop) {
    setSyncing(true);
    try {
      const html=generateHTML(prop);

      try{ const blob=new Blob([html],{type:"text/html"}); htmlUrl=await uploadFile("project-files","proposals/proposal-"+prop.id+".html",blob,"text/html"); }catch(e){}
      setProposals(p=>p.map(x=>x.id===prop.id?{...x,generatedHtml:html,generatedHtmlUrl:htmlUrl,generatedAt:new Date().toISOString().slice(0,10)}:x));
      window.open(URL.createObjectURL(new Blob([html],{type:"text/html"})),"_blank");
    } catch(err){ alert("Error: "+err.message); }
    setSyncing(false);
  }

  function view(prop) {
    const html=prop.generatedHtml;
    if(!html&&prop.generatedHtmlUrl){ fetch(prop.generatedHtmlUrl).then(r=>r.text()).then(h2=>{ setProposals(p=>p.map(x=>x.id===prop.id?{...x,generatedHtml:h2}:x)); window.open(URL.createObjectURL(new Blob([h2],{type:"text/html"})),"_blank"); }); return; }
    if(html) window.open(URL.createObjectURL(new Blob([html],{type:"text/html"})),"_blank");
  }

    const html=prop.generatedHtml||generateHTML(prop);
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download=(prop.name||"proposal").replace(/[^a-z0-9]/gi,"_")+".html"; a.click();

// ─── PAYROLL TAB ──────────────────────────────────────────────────────────────
function PayrollTab({emps,entries,fmtHrs,fmtCost,T}) {
  const [range,setRange] = useState("week");
  const [offset,setOffset] = useState(0);

  const now = Date.now();
  function getRangeBounds() {
    const d=new Date(); d.setHours(0,0,0,0);
    if(range==="week"){ const day=d.getDay()||7; d.setDate(d.getDate()-day+1+offset*7); return [d.getTime(),d.getTime()+7*86400000]; }
    if(range==="month"){ const s=new Date(d.getFullYear(),d.getMonth()+offset,1); const e=new Date(d.getFullYear(),d.getMonth()+1+offset,0,23,59,59); return [s.getTime(),e.getTime()]; }
    return [0,now+86400000*1000];
  }
  const [rStart,rEnd]=getRangeBounds();

  const empRows = emps.map(emp=>{
    const empEntries=entries.filter(e=>e.end&&e.empId===emp.id&&e.start>=rStart&&e.start<=rEnd);
    const hrs=empEntries.reduce((s,e)=>s+(e.end-e.start),0);
    const earned=hrs/3600000*(emp.rate||0);
    const byProj={};
    empEntries.forEach(e=>{ if(!byProj[e.projId])byProj[e.projId]=0; byProj[e.projId]+=(e.end-e.start); });
    return {emp,hrs,earned,byProj};
  });

  const totalHrs=empRows.reduce((s,r)=>s+r.hrs,0);
  const totalEarned=empRows.reduce((s,r)=>s+r.earned,0);

  return h("div",{style:{flex:1,overflowY:"auto",padding:"16px 20px",background:BG}},
    h("div",{className:"stat-grid"},

      h("div",{className:"stat-card"},h("div",{className:"lbl"},"Total Labor"),h("div",{className:"val gold"},"$"+Math.round(totalEarned).toLocaleString()))
    ),
    h("div",{style:{display:"flex",gap:6,alignItems:"center",marginBottom:12}},
      h("div",{className:"filter-tabs"},
        ["week","month","all"].map(r=>h("button",{key:r,className:"ftab"+(range===r?" active":""),onClick:()=>{setRange(r);setOffset(0);}},r==="week"?"Week":r==="month"?"Month":"All Time"))
      ),
      range!=="all"&&h("button",{className:"btn-ghost",style:{padding:"4px 10px"},onClick:()=>setOffset(o=>o-1)},"←"),
      range!=="all"&&h("button",{className:"btn-ghost",style:{padding:"4px 10px"},onClick:()=>setOffset(o=>o+1)},"→")
    ),
    h("div",{style:{background:SURF,borderRadius:12,border:"0.5px solid "+LINE,overflow:"hidden"}},
      h("table",{className:"tbl"},
        h("thead",null,h("tr",null,
          h("th",null,"Employee"),h("th",{className:"r"},"Hours"),h("th",{className:"r"},"Rate"),h("th",{className:"r"},"Earnings")
        )),
        h("tbody",null,
          empRows.map(({emp,hrs,earned})=>
            h("tr",{key:emp.id},
              h("td",null,h("div",{style:{display:"flex",alignItems:"center",gap:8}},
                h("div",{style:{width:28,height:28,borderRadius:"50%",background:emp.color+"25",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,color:emp.color,flexShrink:0}},(emp.name||"?")[0].toUpperCase()),
                h("div",null,h("div",{style:{fontSize:12,fontWeight:500,color:NAVY}},emp.name),h("div",{style:{fontSize:10,color:DIM}},emp.role))
              )),
              h("td",{className:"r",style:{fontSize:12,color:hrs>0?NAVY:DIM}},hrs>0?fmtHrs(hrs):"—"),
              h("td",{className:"r",style:{fontSize:11,color:SUB}},emp.rate?"$"+emp.rate+"/hr":"—"),
              h("td",{className:"r",style:{fontSize:13,fontWeight:earned>0?600:400,color:earned>0?GOLD:DIM}},earned>0?"$"+Math.round(earned).toLocaleString():"—")
            )
          ),
          h("tr",{style:{borderTop:"2px solid "+LINE}},
            h("td",{style:{fontSize:12,fontWeight:600,color:NAVY}},"Total"),
            h("td",{className:"r",style:{fontSize:12,fontWeight:600,color:NAVY}},fmtHrs(totalHrs)),
            h("td",null),
            h("td",{className:"r",style:{fontSize:13,fontWeight:700,color:GOLD}},"$"+Math.round(totalEarned).toLocaleString())
          )
        )
      )
    )
  );
}


// ─── ERROR BOUNDARY ───────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err) return h("div",{style:{padding:40,textAlign:"center",color:"#c0392b"}},
      h("div",{style:{fontSize:18,marginBottom:8}},"Something went wrong"),
      h("div",{style:{fontSize:13,color:"#666",marginBottom:16}},this.state.err.message),
      h("button",{onClick:()=>this.setState({err:null}),style:{padding:"8px 20px",borderRadius:8,background:NAVY,color:"#fff",border:"none",cursor:"pointer"}},"Retry")
    );
    return this.props.children;
  }
}

function App() {
  const [emps,setEmps]         = useState(DEFAULT_EMPS);
  const [projs,setProjs]       = useState(DEFAULT_PROJS);
  const [entries,setEntries]   = useState([]);
  const [cogs,setCogs]         = useState({});
  const [clients,setClients]   = useState([]);
  const [vendors,setVendors]   = useState([]);
  const [projNotes,setProjNotes]       = useState({});
  const [projPayments,setProjPayments] = useState({});
  const [clientOrder,setClientOrder]   = useState([]);
  const [projDetails,setProjDetails]   = useState({});
  const [proposals,setProposals]       = useState([]);
  const [dbReady,setDbReady]   = useState(false);
  const [dbLoading,setDbLoading] = useState(true);
  const [syncing,setSyncing]   = useState(false);
  const [mode,setMode]         = useState("worker");
  const [currentUser,setCurrentUser] = useState(null);
  const [adminTab,setAdminTab] = useState("projects");
  const [pinInput,setPinInput] = useState("");
  const [pinError,setPinError] = useState("");
  const [toast,setToast]       = useState(null);
  const [stale,setStale]       = useState(false);
  const baselineHash = useRef(null);
  // Who's currently clocked in is derived from entries (synced with Supabase),
  // not tracked as separate local state - otherwise a second device (or the
  // same device after a reload) has no way to know someone's already on the
  // clock, and clocking them in again there creates a duplicate open entry
  // that can never be closed through the UI again (silently dropping that
  // block of hours from labor cost, since only entries with an `end` count).
  const activeFor = {};
  entries.forEach(e=>{ if(e.end==null) activeFor[e.empId]={projId:e.projId,start:e.start,entryId:e.id}; });
  const [now2,setNow2]         = useState(Date.now());
  const isFirstRender = useRef({emps:true,projs:true,entries:true});

  function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
  function fmtHrs(ms){const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return h+"h"+(m>0?" "+m+"m":"");}
  function fmtCost(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}

  function entryCost(projId){
    return entries.filter(e=>e.end&&e.projId===projId).reduce((s,e)=>{
      const emp=emps.find(x=>x.id===e.empId);
      return s+(emp?((e.end-e.start)/3600000)*(emp.rate||0):0);
    },0);
  }
  function projCogsTotals(projId){
    const items=cogs[projId]||[];
    return {total:items.reduce((s,i)=>s+(+i.amount||0),0),items};
  }

  useEffect(()=>{const t=setInterval(()=>setNow2(Date.now()),1000);return()=>clearInterval(t);},[]);

  useEffect(()=>{
    let cancelled=false;
    (async()=>{ const h=await fetchSelfHash(); if(!cancelled) baselineHash.current=h; })();
    async function check(){
      if(baselineHash.current==null) return;
      const h=await fetchSelfHash();
      if(h!=null && h!==baselineHash.current) setStale(true);
    }
    const iv=setInterval(check, 5*60*1000);
    function onVisible(){ if(document.visibilityState==="visible") check(); }
    document.addEventListener("visibilitychange",onVisible);
    window.addEventListener("focus",check);
    return ()=>{ cancelled=true; clearInterval(iv); document.removeEventListener("visibilitychange",onVisible); window.removeEventListener("focus",check); };
  },[]);

  useEffect(()=>{
    (async()=>{
      try{
        const [e,p,en,cl,vn,cg,pn,co,pp]=await Promise.all([
          dbLoad("employees"),dbLoad("projects"),dbLoad("entries"),
          dbLoad("clients"),dbLoad("vendors"),dbLoad("cogs"),
          dbLoad("projnotes"),dbLoad("clientorder"),dbLoad("projpayments")
        ]);
        if(e&&e.length>0){const merged=e.map(sb=>{const def=DEFAULT_EMPS.find(x=>x.id===sb.id);return(!(+sb.rate>0)&&def&&def.rate>0)?{...sb,rate:def.rate}:sb;});setEmps(merged);const fix=merged.some((m,i)=>m.rate!==(e[i]&&e[i].rate));if(fix)dbSave("employees",merged);}
        else{setEmps(DEFAULT_EMPS);dbSave("employees",DEFAULT_EMPS);}
        setProjs(p&&p.length>0?p:load("alfa_projs",DEFAULT_PROJS));
        setEntries(en&&en.length>0?en:load("alfa_entries",[]));
        if(cl&&cl.length>0)setClients(cl);
        if(vn&&vn.length>0)setVendors(vn);
        if(cg&&cg.length>0){const obj={};cg.forEach(i=>{if(!obj[i.projId])obj[i.projId]=[];obj[i.projId].push(i);});setCogs(obj);}
        if(pn&&pn.length>0){const obj={};pn.forEach(i=>{if(!obj[i.projId])obj[i.projId]=[];obj[i.projId].push(i);});setProjNotes(obj);}
        if(co&&co.length>0)setClientOrder(co.map(i=>i.name));
        if(pp&&pp.length>0){const obj={};pp.forEach(i=>{if(!obj[i.projId])obj[i.projId]=[];obj[i.projId].push(i);});setProjPayments(obj);}
        const pdRows=await fetch(SB_URL+"/rest/v1/projdetails?select=*",{method:"GET",mode:"cors",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}}).then(r=>r.json()).catch(()=>[]);
        if(pdRows.length>0){const obj={};pdRows.forEach(row=>{const key=String(row.id);const data=row.data||{};obj[key]={...data,files:data.files||[]};});setProjDetails(obj);}
        const pr=await dbLoad("proposals");
        if(pr&&pr.length>0){const lPr=load("alfa_proposals",[]);const merged=pr.map(p=>{const lp=lPr.find(x=>String(x.id)===String(p.id));return lp&&lp.generatedHtml?{...p,generatedHtml:lp.generatedHtml}:p;});setProposals(merged);}
      }catch(err){console.error("Load error",err);setEmps(DEFAULT_EMPS);setProjs(load("alfa_projs",DEFAULT_PROJS));setEntries(load("alfa_entries",[]));}
      setDbReady(true);setDbLoading(false);
    })();
  },[]);

  useEffect(()=>{
    if(!dbReady)return;
    const poll=setInterval(async()=>{
      try{
        const [e,p,en,cg,cl,vn,pn,pp,co]=await Promise.all([
          dbLoad("employees"),dbLoad("projects"),dbLoad("entries"),
          dbLoad("cogs"),dbLoad("clients"),dbLoad("vendors"),
          dbLoad("projnotes"),dbLoad("projpayments"),dbLoad("clientorder")
        ]);
        if(e&&e.length>0){
          const fixed=e.map(sb=>{const def=DEFAULT_EMPS.find(x=>x.id===sb.id);return(!(+sb.rate>0)&&def&&def.rate>0)?{...sb,rate:def.rate}:sb;});
          setEmps(prev=>mergeById(prev,fixed));
        }
        if(p&&p.length>0)setProjs(prev=>mergeById(prev,p));
        if(en&&en.length>0)setEntries(prev=>mergeById(prev,en));
        if(cg&&cg.length>0)setCogs(prev=>mergeGroupedById(prev,cg));
        if(cl&&cl.length>0)setClients(prev=>mergeById(prev,cl));
        if(vn&&vn.length>0)setVendors(prev=>mergeById(prev,vn));
        if(pn&&pn.length>0)setProjNotes(prev=>mergeGroupedById(prev,pn));
        if(pp&&pp.length>0)setProjPayments(prev=>mergeGroupedById(prev,pp));
        if(co&&co.length>0)setClientOrder(co.map(i=>i.name));
        const pdR=await fetch(SB_URL+"/rest/v1/projdetails?select=*",{method:"GET",mode:"cors",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}}).then(r=>r.json()).catch(()=>[]);
        if(pdR.length>0){const obj={};pdR.forEach(row=>{const key=String(row.id);const data=row.data||{};obj[key]={...data,files:data.files||[]};});setProjDetails(obj);}
      }catch(e){}
    },30000);
    return()=>clearInterval(poll);
  },[dbReady]);

  useEffect(()=>{try{localStorage.setItem("alfa_emps",JSON.stringify(emps));}catch{}if(!dbReady||emps.length===0)return;dbSave("employees",emps);},[emps]);
  useEffect(()=>{try{localStorage.setItem("alfa_projs",JSON.stringify(projs));}catch{}if(isFirstRender.current.projs){isFirstRender.current.projs=false;return;}dbSave("projects",projs);},[projs]);
  useEffect(()=>{try{localStorage.setItem("alfa_entries",JSON.stringify(entries));}catch{}if(isFirstRender.current.entries){isFirstRender.current.entries=false;return;}dbSave("entries",entries);},[entries]);
  useEffect(()=>{if(!dbReady||clients.length===0)return;dbSave("clients",clients);},[clients]);
  useEffect(()=>{if(!dbReady||vendors.length===0)return;dbSave("vendors",vendors);},[vendors]);
  useEffect(()=>{if(!dbReady||Object.keys(cogs).length===0)return;const flat=Object.values(cogs).flat();if(flat.length>0)dbSave("cogs",flat);},[cogs]);
  useEffect(()=>{if(!dbReady||Object.keys(projNotes).length===0)return;const flat=Object.values(projNotes).flat();if(flat.length>0)dbSave("projnotes",flat);},[projNotes]);
  useEffect(()=>{if(!dbReady||Object.keys(projPayments).length===0)return;const flat=Object.values(projPayments).flat();if(flat.length>0)dbSave("projpayments",flat);},[projPayments]);
  useEffect(()=>{if(!dbReady||clientOrder.length===0)return;dbSave("clientorder",clientOrder.map(n=>({name:n})));},[clientOrder]);
  useEffect(()=>{
    if(!dbReady||Object.keys(projDetails).length===0)return;
    const flat=Object.entries(projDetails).map(([projId,data])=>{
      const files=(data.files||[]).map(f=>f.url?{id:f.id,name:f.name,type:f.type,url:f.url,path:f.path,date:f.date}:f);
      return {id:String(projId),data:{...data,files,projId:+projId}};
    });
    dbSaveKeyed("projdetails",flat);
    try{localStorage.setItem("alfa_projdetails",JSON.stringify(projDetails));}catch{}
  },[projDetails]);
  useEffect(()=>{
    if(!dbReady||proposals.length===0)return;
    const flat=proposals.map(p=>{const{generatedHtml,...rest}=p;return rest;});
    dbSave("proposals",flat);
    try{localStorage.setItem("alfa_proposals",JSON.stringify(proposals));}catch{}
  },[proposals]);

  function clockIn(empId,projId){
    if(entries.some(e=>e.empId===empId&&e.end==null)){
      setToast({msg:"Already clocked in"});
      setTimeout(()=>setToast(null),2800);
      return;
    }
    const entry={id:Date.now(),empId,projId,start:Date.now(),end:null};
    setEntries(p=>[...p,entry]);
    const emp=emps.find(e=>e.id===empId);const proj=projs.find(p=>p.id===projId);
    setToast({msg:"+ "+emp?.name+" clocked in - "+proj?.name});
    setTimeout(()=>setToast(null),2800);
  }
  function clockOut(empId){
    const a=activeFor[empId];if(!a)return;
    setEntries(p=>p.map(e=>e.id===a.entryId?{...e,end:Date.now()}:e));
    const emp=emps.find(e=>e.id===empId);
    setToast({msg:"+ "+emp?.name+" clocked out"});
    setTimeout(()=>setToast(null),2800);
  }
  function tryPin(){
    const user=ADMIN_USERS.find(u=>u.pin===pinInput);
    if(user){setCurrentUser(user);setMode("admin");setPinInput("");setPinError("");const tabs=ROLE_TABS[user.role];if(tabs)setAdminTab(tabs[0]);}
    else{setPinError("Incorrect PIN");setTimeout(()=>setPinError(""),1500);}
  }

  async function migrateLocalFiles(){
    setSyncing(true);
    try{
      const pd=JSON.parse(localStorage.getItem("alfa_projdetails")||"{}");
      let done=0,failed=0;
      for(const projId in pd){
        const files=pd[projId].files||[];let changed=false;
        for(let i=0;i<files.length;i++){
          const f=files[i];if(f.url||!f.data)continue;
          try{
            const parts=f.data.split(",");const mime=parts[0].match(/:(.*?);/)[1];
            const bin=atob(parts[1]);const bytes=new Uint8Array(bin.length);
            for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
            const blob=new Blob([bytes],{type:mime});
            const ext=f.name.split(".").pop().toLowerCase();
            const path="proj-"+projId+"/migrate-"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
            const r=await fetch(SB_STORAGE_URL+"/object/project-files/"+path,{method:"POST",headers:{...SB_HEADERS,"Content-Type":mime,"x-upsert":"true"},body:blob});
            if(r.ok){const url=SB_STORAGE_URL+"/object/public/project-files/"+path;files[i]={id:f.id,name:f.name,type:mime,url,path,date:f.date||new Date().toISOString().slice(0,10)};changed=true;done++;}
            else failed++;
          }catch(e){failed++;}
        }
        if(changed){
          pd[projId].files=files;
          const cleanF=files.map(f=>({id:f.id,name:f.name,type:f.type,url:f.url,path:f.path,date:f.date})).filter(f=>f.url);
          await dbSaveKeyed("projdetails",[{id:String(projId),data:{...pd[projId],files:cleanF,projId:+projId}}]);
        }
      }
      localStorage.setItem("alfa_projdetails",JSON.stringify(pd));
      alert("Done! "+done+" files uploaded"+(failed>0?", "+failed+" failed":""));
    }catch(err){alert("Error: "+err.message);}
    setSyncing(false);
  }

  const activeProjs = projs.filter(p=>p.status==="In Progress");
  const T={text:NAVY,sub:SUB,dim:DIM,green:"#2d7a4f",amber:GOLD,blue:"#2563EB",border:LINE,line:LINE,surf:SURF,faint:"#f8f6f2",bg:BG};

  const staleBanner = stale && h("div",{style:{position:"fixed",top:0,left:0,right:0,zIndex:9999,background:"#c0392b",color:"#fff",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"center",gap:14,fontSize:13,fontWeight:600,flexWrap:"wrap",textAlign:"center"}},
    "⚠ A newer version of this app is available — saving on this tab risks overwriting recent changes.",
    h("button",{onClick:()=>window.location.reload(),style:{background:"#fff",color:"#c0392b",border:"none",borderRadius:6,padding:"6px 16px",fontWeight:700,cursor:"pointer",flexShrink:0}},"Refresh Now")
  );

  if(dbLoading) return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:BG,gap:8}},
    h("div",{style:{fontSize:22,fontWeight:700,color:GOLD,letterSpacing:"0.06em"}},"ALFA STUDIO"),
    h("div",{style:{fontSize:12,color:DIM,marginTop:4}},"Loading...")
  );

  if(mode==="worker") return h("div",{style:{minHeight:"100vh",background:BG,paddingBottom:"env(safe-area-inset-bottom)"}},
    staleBanner,
    h("div",{style:{background:NAVY,padding:"16px 20px 14px",paddingTop:"max(16px,env(safe-area-inset-top))"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("div",{style:{fontSize:16,fontWeight:700,color:GOLD,letterSpacing:"0.06em"}},"ALFA STUDIO"),
        h("button",{onClick:()=>setMode("pin"),style:{background:"rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",border:"none",borderRadius:6,padding:"5px 12px",fontSize:11,cursor:"pointer"}},"Admin")
      )
    ),
    h("div",{style:{padding:16,maxWidth:1100,margin:"0 auto"}},
      (()=>{ const activeEmps=emps.filter(e=>e.active!==false); return activeEmps.length===0
        ? h("div",{style:{textAlign:"center",padding:"60px 0",color:DIM,fontSize:13}},"No crew set up yet.")
        : h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12,alignItems:"start"}},
          activeEmps.map(emp=>{
          const a=activeFor[emp.id];
          const myProjs=activeProjs.filter(p=>(p.assignedTo||[]).includes(emp.id));
          return h("div",{key:emp.id,style:{background:SURF,borderRadius:14,border:"0.5px solid "+LINE,overflow:"hidden"}},
            h("div",{style:{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"0.5px solid "+LINE}},
              h("div",{style:{width:32,height:32,borderRadius:"50%",background:emp.color+"20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:emp.color,flexShrink:0}},(emp.name||"?")[0].toUpperCase()),
              h("div",{style:{fontSize:14,fontWeight:600,color:NAVY}},emp.name)
            ),
            h("div",{style:{padding:"12px 16px"}},
              myProjs.length===0
                ? h("div",{style:{fontSize:12,color:DIM}},"No active projects assigned.")
                : myProjs.map(proj=>{
                    const isActive=a&&a.projId===proj.id;
                    const elapsed=isActive?now2-a.start:0;
                    const hh=Math.floor(elapsed/3600000),mm=Math.floor((elapsed%3600000)/60000),ss=Math.floor((elapsed%60000)/1000);
                    return h("div",{key:proj.id,style:{display:"flex",alignItems:"center",gap:12,marginBottom:8}},
                      h("div",{style:{flex:1}},
                        h("div",{style:{fontSize:13,fontWeight:500,color:NAVY}},proj.name),
                        isActive&&h("div",{style:{fontSize:11,fontWeight:600,color:GOLD,fontVariantNumeric:"tabular-nums"}},String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0"))
                      ),
                      h("button",{disabled:a&&!isActive,onClick:()=>isActive?clockOut(emp.id):clockIn(emp.id,proj.id),
                        style:{padding:"7px 16px",borderRadius:20,fontSize:12,fontWeight:600,border:"none",cursor:a&&!isActive?"default":"pointer",
                          opacity:a&&!isActive?0.4:1,
                          background:isActive?"#ffebeb":"#fff8e6",color:isActive?"#c0392b":NAVY}},isActive?"Clock Out":"Clock In")
                    );
                  })
            )
          );
        })
      );})()
    ),
    toast&&h("div",{style:{position:"fixed",bottom:32,left:"50%",transform:"translateX(-50%)",background:NAVY,color:"#fff",borderRadius:12,padding:"10px 20px",fontSize:13,fontWeight:500,zIndex:200,whiteSpace:"nowrap"}},toast.msg)
  );

  if(mode==="pin") return h("div",{style:{minHeight:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center",padding:20}},
    staleBanner,
    h("div",{style:{background:SURF,borderRadius:20,padding:"32px 28px",width:"100%",maxWidth:320,textAlign:"center"}},
      h("div",{style:{fontSize:18,fontWeight:700,color:GOLD,letterSpacing:"0.06em",marginBottom:4}},"ALFA STUDIO"),
      h("div",{style:{fontSize:12,color:DIM,marginBottom:24}},"Admin access"),
      h("input",{type:"password",inputMode:"numeric",maxLength:6,value:pinInput,onChange:e=>setPinInput(e.target.value),onKeyDown:e=>e.key==="Enter"&&tryPin(),autoFocus:true,
        placeholder:"PIN",style:{width:"100%",textAlign:"center",fontSize:22,letterSpacing:"0.3em",border:"0.5px solid "+LINE,borderRadius:10,padding:"12px",outline:"none",background:"#f8f6f2",marginBottom:12}}),
      pinError&&h("div",{style:{fontSize:12,color:"#c0392b",marginBottom:8}},pinError),
      h("button",{onClick:tryPin,style:{width:"100%",padding:"10px",fontSize:14,background:GOLD,color:NAVY,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer"}},"Enter"),
      h("button",{onClick:()=>{setMode("worker");setPinInput("");},style:{marginTop:12,background:"none",border:"none",color:DIM,fontSize:12,cursor:"pointer"}},"Back")
    )
  );

  const tabs=ROLE_TABS[currentUser?.role]||ROLE_TABS.owner;
  return h("div",{style:{display:"flex",flexDirection:"column",height:"100vh",background:BG}},
    staleBanner,
    h("div",{style:{background:NAVY,padding:"0 20px",display:"flex",alignItems:"center",gap:0,flexShrink:0,paddingTop:"env(safe-area-inset-top)"}},
      h("div",{style:{fontSize:14,fontWeight:700,color:GOLD,letterSpacing:"0.06em",marginRight:24,paddingTop:12,paddingBottom:12}},"ALFA STUDIO"),
      h("div",{style:{display:"flex",flex:1,gap:0,overflowX:"auto"}},
        tabs.map(tab=>h("button",{key:tab,onClick:()=>setAdminTab(tab),
          style:{padding:"12px 16px",border:"none",cursor:"pointer",fontSize:12,fontWeight:500,
            background:"transparent",borderBottom:"2px solid "+(adminTab===tab?GOLD:"transparent"),
            color:adminTab===tab?"#fff":"rgba(255,255,255,0.45)",whiteSpace:"nowrap"}},
          tab.charAt(0).toUpperCase()+tab.slice(1)
        ))
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center",paddingLeft:12}},
        h("button",{onClick:migrateLocalFiles,disabled:syncing,title:"Upload local files to cloud",
          style:{fontSize:10,color:GOLD,background:GOLD+"15",border:"0.5px solid "+GOLD+"40",borderRadius:4,padding:"3px 8px",cursor:"pointer"}},syncing?"...":"migrate"),
        h("button",{onClick:()=>{setMode("worker");setCurrentUser(null);},
          style:{fontSize:10,color:"rgba(255,255,255,0.5)",background:"rgba(255,255,255,0.08)",border:"none",borderRadius:4,padding:"3px 8px",cursor:"pointer"}},"Lock")
      )
    ),
    adminTab==="projects"  && h(ProjectsTab,{projs,setProjs,emps,entries,cogs,setCogs,projDetails,setProjDetails,projNotes,setProjNotes,projPayments,setProjPayments,clients,vendors,fmtHrs,fmtCost,entryCost,projCogsTotals,dbReady,T}),
    adminTab==="proposals" && h(ProposalsTabNew,{proposals,setProposals,clients,projs,projDetails,T}),
    adminTab==="crew"      && h(CrewTab,{emps,setEmps,entries,fmtHrs,fmtCost,T}),
    adminTab==="clients"   && h(ClientsTabNew,{clients,setClients,projs,fmtCost,entryCost,projCogsTotals,T}),
    adminTab==="vendors"   && h(VendorsTabNew,{vendors,setVendors,cogs,fmtCost,T}),
    adminTab==="payroll"   && h(PayrollTab,{emps,entries,fmtHrs,fmtCost,T}),
    toast&&h("div",{style:{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:NAVY,color:"#fff",borderRadius:12,padding:"10px 20px",fontSize:13,fontWeight:500,zIndex:200,whiteSpace:"nowrap"}},toast.msg)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(ErrorBoundary,null,h(App)));
</script>
</body>
</html>
